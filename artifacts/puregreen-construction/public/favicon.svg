<svg width="180" height="180" viewBox="0 0 180 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Forest green background with rounded corners -->
  <rect width="180" height="180" rx="36" fill="#166534"/>

  <!-- House roof (triangle) -->
  <polygon points="90,28 148,80 32,80" fill="white" opacity="0.95"/>

  <!-- House body -->
  <rect x="46" y="78" width="88" height="64" rx="2" fill="white" opacity="0.95"/>

  <!-- Door -->
  <rect x="75" y="104" width="30" height="38" rx="3" fill="#166534"/>

  <!-- Left window -->
  <rect x="54" y="90" width="18" height="16" rx="2" fill="#166534"/>

  <!-- Right window -->
  <rect x="108" y="90" width="18" height="16" rx="2" fill="#166534"/>

  <!-- Chimney -->
  <rect x="114" y="36" width="14" height="30" rx="2" fill="white" opacity="0.95"/>
</svg>
