kind = "web"
previewPath = "/"
title = "PureGreen Construction"
version = "1.0.0"
id = "artifacts/puregreen-construction"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20183

[services.development]
run = "pnpm --filter @workspace/puregreen-construction run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/puregreen-construction", "run", "build" ]
serve = "static"
publicDir = "artifacts/puregreen-construction/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20183"
BASE_PATH = "/"
